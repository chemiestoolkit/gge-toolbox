name: Anti Black Souls — joins/leaves watch

# Polls gge-tracker for Black Souls' member movements and pings a Discord
# webhook on any new join/leave. State (the last-posted timestamp) is kept in
# the Actions cache, so this never commits to main and adds no history noise.
on:
  # Timed against gge-tracker, not against the clock. Its crawler publishes once
  # an hour at ~:20 — every event timestamp in the movements and renames feeds
  # lands at :20 or :21, around the clock — so polling more often than hourly
  # just re-reads the same rows. What DID cost us was polling at :05, 45 minutes
  # after the crawl we were reading; :30 collects the same data ~9 minutes after
  # it lands, and dodges the top-of-hour queue that delays scheduled jobs.
  #
  # The :50 run is a backstop, not extra freshness: transient upstream 522s make
  # a feed skip its cycle, and GitHub drops scheduled runs under load, so this
  # retries within the hour instead of leaving a 60-minute hole. It posts
  # nothing when the :30 run already succeeded — state is per-row, not per-run.
  schedule:
    - cron: "30,50 * * * *"
  # Manual button in the Actions tab for testing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alliance-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Restore the last-seen watermark. A unique save key each run guarantees
      # the cache is always written; restore-keys grabs the most recent prior one.
      - name: Restore watch state
        uses: actions/cache@v4
        with:
          path: tools/_srcdata/cache/alliance-watch-state.json
          key: alliance-watch-state-${{ github.run_id }}
          restore-keys: |
            alliance-watch-state-

      - name: Poll movements and notify Discord
        env:
          DISCORD_ALLIANCE_HOOK: ${{ secrets.DISCORD_ALLIANCE_HOOK }}
          # Optional mirror — same arrivals/departures feed to a second channel.
          DISCORD_ALLIANCE_HOOK_2: ${{ secrets.DISCORD_ALLIANCE_HOOK_2 }}
        run: python3 tools/_srcdata/alliance-watch.py
